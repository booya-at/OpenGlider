[workspace]
authors = ["looooo <sppedflyer@gmail.com>"]
channels = ["conda-forge", "freecad/label/dev"]
description = "Add a short description here"
name = "OpenGlider"
platforms = ["osx-arm64", "linux-aarch64", "linux-64", "osx-64", "win-64"]
version = "0.8.1"

[pypi-dependencies]
openglider = { path = ".", editable = true }

[dependencies]

pip = "*"
svgwrite = "*"
numpy = ">=1.26,<1.27"
scipy = "*"
ezdxf = "*"
ezodf = "*"
meshpy = "*"
lxml = "*"
pyexcel-ods3 = "*"
matplotlib = "*"
parabem = "*"
pylint = "*"
freecad = ">=1.0.0,<1.1.0"
sphinx = "*"
pytest = "*"

# Tests: siehe tests/README.md. test = nur Unit; test-all = inkl. Visual (benötigt Display/VTK).
[tasks]
test = "pytest tests/ -m \"not visual\""
test-all = "pytest tests/ --override-ini=\"python_files=test_*.py visual_test_*.py\""
lint = "pylint $(git ls-files '*.py')"
docs = "sphinx-build -b html docs/source docs/build/html"
