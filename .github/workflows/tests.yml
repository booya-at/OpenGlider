name: run all tests

on: [push, pull_request]

jobs:
  test:
    strategy:
        fail-fast: false
        matrix:
            os: [macOs-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: test
    steps:
    - uses: actions/checkout@v3
    - uses: prefix-dev/setup-pixi@v0.8.0
      with:
        pixi-version: v0.39.0
        cache: true
    - run: pixi run test
